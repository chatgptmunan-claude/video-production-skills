services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pad
      POSTGRES_PASSWORD: pad
      POSTGRES_DB: pinterest_animal_dedup
    ports:
      - "54329:5432"
    volumes:
      - pad_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pad -d pinterest_animal_dedup"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pad_pg_data:
